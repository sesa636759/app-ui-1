  <style>
    * {

      width="260px"

        <span style="font-weight:600;font-size:18px;">MyApp</span>
      </div>
      <div slot="secondary" style="padding:8px 16px;"><input type="search" placeholder="Search..." style="width:100%;padding:6px;border-radius:6px;border:1px solid #ccc;" /></div>
      <div slot="footer" style="padding:8px 16px;"><button style="width:100%;padding:8px;border-radius:6px;background:#ef4444;color:#fff;border:none;">Logout</button></div>

          <button onclick="showSection('aside-panel')" class="nav-btn" data-section="aside-panel">📱 Aside Panel</button>
          <button onclick="showSection('avatar')" class="nav-btn" data-section="avatar">👤 Avatar</button>

          <button onclick="showSection('badge')" class="nav-btn" data-section="badge">🔔 Badge</button>
          <button onclick="showSection('bar-chart')" class="nav-btn" data-section="bar-chart">📊 Bar Chart</button>

          <button onclick="showSection('card')" class="nav-btn" data-section="card">🃏 Card</button>

          <button onclick="showSection('chip')" class="nav-btn" data-section="chip">🏷️ Chip</button>
          <button onclick="showSection('context-menu')" class="nav-btn" data-section="context-menu">📋 Context Menu</button>
          <button onclick="showSection('dialog')" class="nav-btn" data-section="dialog">💬 Dialog</button>
          <button onclick="showSection('dock')" class="nav-btn" data-section="dock">🚢 Dock</button>
          <button onclick="showSection('dropdown')" class="nav-btn" data-section="dropdown">📋 Dropdown</button>
          <button onclick="showSection('horizontal-nav')" class="nav-btn" data-section="horizontal-nav">↔️ Horizontal Nav</button>
          <button onclick="showSection('knob')" class="nav-btn" data-section="knob">🎛️ Knob</button>

          <button onclick="showSection('smart-stepper')" class="nav-btn" data-section="smart-stepper">🧠 Smart Stepper</button>
          <button onclick="showSection('snackbar')" class="nav-btn" data-section="snackbar">🍞 Snackbar</button>
          <button onclick="showSection('speed-dial')" class="nav-btn" data-section="speed-dial">⚡ Speed Dial</button>
          <button onclick="showSection('speedometer')" class="nav-btn" data-section="speedometer">🎯 Speedometer</button>
          <button onclick="showSection('dock-host')" class="nav-btn" data-section="dock-host">🗂️ Dock Host</button>
          

          <button onclick="showSection('switch')" class="nav-btn" data-section="switch">🔘 Switch</button>

    <main class="main-content">
      <h1>Component Library Demo</h1>

      <!-- Home Section -->
      <section id="home" class="demo-section section-active">
        <h2>🏠 Welcome to Component Library</h2>
        <p>Explore our collection of reusable UI components. Click on any component to view its full demo and documentation.</p>
        <!-- Home content will be generated by JavaScript -->
      </section>

      <!-- Demo Section Containers (Loaded Dynamically) -->
      <div id="context-menu" class="demo-section"></div>
      <div id="smart-menu" class="demo-section"></div>
      <div id="stepper" class="demo-section"></div>

      <div id="scroll-top" class="demo-section"></div>
      <div id="rating" class="demo-section"></div>
      <div id="speed-dial" class="demo-section"></div>
      <div id="otp-input" class="demo-section"></div>
      <div id="speedometer" class="demo-section"></div>
      <div id="advanced-data-table" class="demo-section"></div>
      <div id="cascade-select" class="demo-section"></div>
      <div id="range-slider" class="demo-section"></div>
      <div id="transfer-list" class="demo-section"></div>
      <div id="tree-list" class="demo-section"></div>
      <div id="pagination" class="demo-section"></div>
      <div id="pattern-input" class="demo-section"></div>
      <div id="skeleton" class="demo-section"></div>
      <div id="top-bar" class="demo-section"></div>
      <div id="dock" class="demo-section"></div>
      <div id="dropdown" class="demo-section"></div>
      <div id="popover" class="demo-section"></div>
      <div id="anchor" class="demo-section"></div>
      <div id="theme-selector" class="demo-section"></div>
      <div id="breadcrumb" class="demo-section"></div>
      <div id="button" class="demo-section"></div>
      <div id="horizontal-nav" class="demo-section"></div>
      <div id="chart" class="demo-section"></div>
      <div id="knob" class="demo-section"></div>
      <div id="switch" class="demo-section"></div>
