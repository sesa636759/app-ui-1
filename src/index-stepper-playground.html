<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stepper Playground</title>
  <link rel="stylesheet" href="/build/assets/styles/tailwind-optimized.css">
  <script type="module" src="/build/exploration-project-tailwind.esm.js"></script>
</head>
<body class="bg-gray-50 p-8">
  <h1 class="text-2xl font-bold mb-4">Stepper Playground</h1>
  <div class="mb-4">
    <label for="orientation" class="mr-2">Orientation:</label>
    <select id="orientation">
      <option value="horizontal">Horizontal</option>
      <option value="vertical">Vertical</option>
    </select>
    <label for="size" class="ml-4 mr-2">Size:</label>
    <select id="size">
      <option value="sm">Small</option>
      <option value="md" selected>Medium</option>
      <option value="lg">Large</option>
    </select>
  </div>
  <div id="stepper-playground-section" class="demo-section">
    <ui-stepper id="playground-stepper" orientation="horizontal" size="md"></ui-stepper>
  </div>
  <script type="module">
    const stepper = document.getElementById('playground-stepper');
    const steps = [
      { label: 'Step 1', status: 'completed' },
      { label: 'Step 2', status: 'active' },
      { label: 'Step 3', status: 'pending' }
    ];
    stepper.steps = steps;
    document.getElementById('orientation').addEventListener('change', e => {
      stepper.orientation = e.target.value;
    });
    document.getElementById('size').addEventListener('change', e => {
      stepper.size = e.target.value;
    });
  </script>
</body>
</html>
